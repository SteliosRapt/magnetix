<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magnetix</title>
<style>
:root{
  --bg:#1e1e1e; --side:#252526; --act:#333333; --border:#2b2b2b;
  --fg:#cccccc; --dim:#858585; --sel:#37373d; --hover:#2a2d2e;
  --accent:#007acc; --accent2:#3794ff; --track:#3c3c3c;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:13px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit}
#app{display:flex;height:100vh;width:100vw}

/* activity bar */
#activity{width:48px;flex:none;background:var(--act);display:flex;flex-direction:column;align-items:center;padding:4px 0 8px;z-index:3}
.act{width:48px;height:48px;border:0;background:none;color:var(--dim);display:grid;place-items:center;cursor:pointer;position:relative;outline:none}
.act:hover{color:var(--fg)}
.act.on{color:#fff}
.act.on::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:2px;background:#fff;border-radius:0 1px 1px 0}
.act svg{width:22px;height:22px}
.spacer{flex:1}

/* panels */
.panel{flex:none;width:var(--w);background:var(--side);overflow:hidden;position:relative;
  transition:width .26s cubic-bezier(.2,.8,.2,1)}
.panel.closed{width:0;border-width:0!important}
.panel-inner{width:var(--w);height:100%;display:flex;flex-direction:column}
#explorer{--w:232px;border-right:1px solid var(--border)}
#params{--w:276px;border-left:1px solid var(--border)}
.ph{height:35px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 20px;
  font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#bbbbbb}
.x{width:22px;height:22px;border:0;background:none;color:var(--dim);border-radius:5px;display:grid;place-items:center;
  cursor:pointer;opacity:0;transition:opacity .15s,background .15s;outline:none}
.panel:hover .x{opacity:1}
.x:hover{background:#ffffff14;color:var(--fg)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden}
.scroll::-webkit-scrollbar{width:10px}
.scroll::-webkit-scrollbar-thumb{background:#79797955;border:3px solid var(--side);border-radius:6px}

/* tree */
.grp{height:24px;display:flex;align-items:center;gap:2px;padding-left:10px;cursor:pointer;color:var(--dim)}
.grp:hover{color:var(--fg)}
.grp svg{transition:transform .15s}
.grp.collapsed svg{transform:rotate(-90deg)}
.grp.collapsed + .items{display:none}
.item{height:26px;display:flex;align-items:center;padding-left:34px;cursor:pointer;color:var(--fg);
  border-left:2px solid transparent;white-space:nowrap}
.item:hover{background:var(--hover)}
.item.sel{background:var(--sel);border-left-color:var(--accent);color:#fff}

/* viewport */
#view{flex:1;position:relative;min-width:0}
#view canvas{display:block;width:100%;height:100%;outline:none}
#title{position:absolute;left:22px;top:15px;font-size:15px;color:#e2e2e2;letter-spacing:.01em;pointer-events:none}
#spin{position:absolute;right:18px;bottom:16px;width:14px;height:14px;border-radius:50%;
  border:1.5px solid #ffffff1f;border-top-color:#4fc1ff;animation:sp .8s linear infinite;opacity:0;transition:opacity .25s;pointer-events:none}
#spin.on{opacity:1}
#toolbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:2;white-space:nowrap}
#toolbar.low{top:44px}
#toolbar:empty{display:none}
.seg{display:flex;gap:1px;padding:2px;border-radius:8px;background:rgba(45,45,48,.78);border:1px solid #3c3c3c;
  backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);box-shadow:0 6px 18px rgba(0,0,0,.28)}
.seg button{height:24px;min-width:30px;padding:0 9px;border:0;border-radius:6px;background:none;color:#b5b5b5;font-size:12px;
  display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;outline:none;transition:background .12s,color .12s}
.seg button:hover{background:#ffffff12;color:#e8e8e8}
.seg button.on{background:#5a5a5f;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.dot{width:15px;height:15px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;line-height:1;font-weight:600}
.dot.pos{background:#f48771}.dot.neg{background:#c586c0}
.sw{width:26px;height:15px;border-radius:8px;background:#4a4a4f;position:relative;transition:background .18s}
.sw i{position:absolute;left:2px;top:2px;width:11px;height:11px;border-radius:50%;background:#e6e6e6;transition:transform .18s}
.seg button.on .sw{background:var(--accent)}
.seg button.on .sw i{transform:translateX(11px)}
.seg button[data-act=circuit].on{background:none;box-shadow:none}
#hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);font-size:12px;color:#7a7a7a;white-space:nowrap;
  pointer-events:none;opacity:0;transition:opacity .4s}
#hint.on{opacity:1}
#offs{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.offi{position:absolute;left:0;top:0;width:0;height:0}
.offi::after{content:"";position:absolute;left:-7px;top:-6px;border-left:12px solid var(--c);border-top:6px solid transparent;border-bottom:6px solid transparent;
  filter:drop-shadow(0 0 3px rgba(0,0,0,.6));opacity:.85}
.offi.sel::after{border-left-width:15px;opacity:1}
.seg button.dis{opacity:.32;pointer-events:none}
.seg button.accent{color:#fff;background:var(--accent)}
.seg button.accent:hover{background:#1a8ad4}
/* charge list + inspector */
.sech{display:flex;align-items:center;justify-content:space-between;padding-right:14px}
.sbtn{display:flex;gap:4px}
.sbtn button,.ib{border:0;background:none;padding:3px;border-radius:5px;cursor:pointer;color:var(--dim);display:grid;place-items:center;outline:none}
.sbtn button:hover,.ib:hover{background:#ffffff14;color:var(--fg)}
.sbtn button:disabled{opacity:.35;pointer-events:none}
.clist{display:flex;flex-direction:column;gap:1px;margin:2px -8px 0}
.empty{color:var(--dim);font-size:12px;padding:6px 8px}
.crow{display:flex;align-items:center;gap:8px;height:28px;padding:0 4px 0 8px;border-radius:6px;cursor:pointer}
.crow:hover{background:var(--hover)}
.crow.sel{background:var(--sel);box-shadow:inset 2px 0 var(--accent)}
.crow.hid .dot,.crow.hid .cname{opacity:.4}
.cname{color:#e6e6e6;width:24px}
.cmeta{flex:1;color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .ib{opacity:0}.crow:hover .ib,.crow.hid [data-eye]{opacity:1}
.mseg{display:flex;background:#2d2d30;border:1px solid #3c3c3c;border-radius:6px;padding:1px;gap:1px}
.mseg button{border:0;background:none;color:#b5b5b5;font-size:11.5px;height:20px;min-width:24px;padding:0 6px;border-radius:4px;cursor:pointer;outline:none}
.mseg button:hover{color:#fff;background:#ffffff10}
.mseg button.on{background:#5a5a5f;color:#fff}
.mseg button:disabled{pointer-events:none}
.mseg button:disabled:not(.on){opacity:.4}
#insp .trow{gap:6px}
#insp .trow>span:first-child{flex:1}
.padwrap{display:grid;place-items:center;padding:8px 0 4px}
.pad{touch-action:none;user-select:none}
.pad.live{cursor:crosshair}
.pring{fill:none;stroke:#333336;stroke-width:1}
.pring.outer{fill:#1e1e1e;stroke:#4a4a4f}
.pax{stroke:#3c3c40;stroke-width:1}
.plab{fill:#858585;font-size:10px}
.pb{stroke:#3794ff;stroke-width:1.5;stroke-dasharray:3 3;opacity:.8}
.pblab{fill:#3794ff;font-size:10px}
.pbsym{fill:none;stroke:#3794ff;stroke-width:1.3}.pbdot{fill:#3794ff}.pbx{stroke:#3794ff;stroke-width:1.3}
.pv{stroke-width:2.2;stroke-linecap:round}
.ph{stroke:#fff;stroke-width:1.5}
#insp input:disabled{opacity:.45;cursor:default}
.rgrid{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:10px 0 2px;font-size:12px;color:var(--dim)}
.rgrid b{font-weight:400;color:#e0e0e0;text-align:right;font-variant-numeric:tabular-nums}
.note{margin-top:10px;font-size:12px;color:var(--dim)}
.btn.danger{color:#f48771}
.btn.danger:hover{border-color:#f4877166}
.pgrid{display:flex;flex-wrap:wrap;gap:6px}
.pgrid .btn{margin:0;width:auto;flex:1 1 auto;padding:0 12px;white-space:nowrap}
.tabs{display:flex;gap:2px;margin-left:-8px;height:100%}
.tabs button{border:0;background:none;color:var(--dim);font:inherit;letter-spacing:inherit;text-transform:inherit;padding:0 8px;cursor:pointer;
  position:relative;display:flex;align-items:center;gap:6px;outline:none}
.tabs button:hover{color:#cfcfcf}
.tabs button.on{color:#e8e8e8}
.tabs button.on::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:1px;background:var(--accent)}
.badge{min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#4d4d52;color:#fff;font-size:10px;letter-spacing:0;display:grid;place-items:center}
.badge[hidden]{display:none}
.simrow{display:flex;gap:6px}
.simstat{margin-top:8px;font-size:12px;color:var(--dim);line-height:1.5}.simstat b{color:#e0e0e0;font-weight:500}
#hud{position:absolute;right:14px;top:52px;width:380px;padding:10px 12px 10px;border-radius:12px;background:rgba(30,30,32,.82);border:1px solid #3c3c3c;
  backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:3;font-size:12px}
#hud[hidden]{display:none}
#hud.docked{position:static;width:auto;margin:0;padding:12px 20px 16px;border:0;border-bottom:1px solid var(--border);border-radius:0;
  background:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
#hud.docked .hud-row{flex-direction:column;align-items:center;gap:10px}
#hud.docked .hud-num{width:100%}
#hud.docked .hud-leg span{margin-left:0;width:100%}
.hud-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
#hudq{display:flex;align-items:center;gap:7px;color:#e8e8e8;font-weight:500}
.hud-sub{flex:1;color:var(--dim);font-size:11px}
.hud-row{display:flex;gap:12px}
.hud-num{flex:1;display:grid;grid-template-columns:max-content 1fr;align-content:start;gap:3px 8px;font-size:11.5px;color:var(--dim)}
.hud-num b{color:#e6e6e6;font-weight:400;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hud-num .cb{color:#4fc1ff}.hud-num .cf{color:#dcdcaa}.hud-num .ce{color:#89d185}
.hud-leg{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0 4px;color:var(--dim);font-size:11px}
.hud-leg i{width:12px;height:3px;border-radius:2px;display:inline-block;margin-left:4px}
.hud-leg span{margin-left:auto}
.kb{background:#4fc1ff}.kf{background:#dcdcaa}.ke{background:#89d185}.k1{background:#f48771}.k2{background:#c586c0}.k3{background:rgba(55,148,255,.5);height:8px!important}
#hudc{width:100%;height:75px;display:block;border-radius:6px;background:#1b1b1d}
#accscope{width:100%;height:78px;display:block;border-radius:6px;background:#1b1b1d;margin-top:8px}
.sclg{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:11px;color:var(--dim);margin-top:5px}
.sclg i{width:12px;height:3px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:middle}
.fk.fe i,.fk.fe i::after{background:#89d185;border-left-color:#89d185}.fk.fe i::after{background:none}
.hx-bg{fill:#1b1b1d}.hx-ax{stroke:#333;stroke-width:1}.hx-l{fill:#6f6f6f;font-size:10px}
.hx-pipe{fill:none;stroke:#5a5f66;stroke-width:1.2;stroke-dasharray:3 3}.hx-orb{fill:#5a5f66}
.hx-b{stroke:#4fc1ff;stroke-width:2.2;stroke-linecap:round}.hx-bf{fill:#4fc1ff}
.hx-f{stroke:#dcdcaa;stroke-width:2.6;stroke-linecap:round}.hx-ff{fill:#dcdcaa}
.hx-e{stroke:#89d185;stroke-width:2.6;stroke-linecap:round}.hx-ef{fill:#89d185}
.hx-q.pos{fill:#f48771}.hx-q.neg{fill:#c586c0}.hx-q{stroke:#fff;stroke-width:1.2}.hx-x{stroke:#fff;stroke-width:1.3}
.fk{display:flex;align-items:center;gap:8px}
.fk i{width:14px;height:2px;background:#dcdcaa;border-radius:1px;position:relative}
.fk i::after{content:"";position:absolute;right:-3px;top:-3px;border-left:5px solid #dcdcaa;border-top:4px solid transparent;border-bottom:4px solid transparent}
.simrow .btn{display:flex;align-items:center;justify-content:center;gap:6px;flex:1}
.simrow .btn:disabled{opacity:.4;pointer-events:none}
.simrow [data-sim=play]:not(:disabled){background:var(--accent);border-color:var(--accent);color:#fff}
.simrow [data-sim=play]:not(:disabled):hover{background:#1a8ad4}
@keyframes sp{to{transform:rotate(360deg)}}

/* parameters */
.plist{padding:2px 20px 4px}
.sec{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#bbbbbb;padding:18px 20px 4px}
.row{padding:8px 0 6px}
.lab{display:flex;justify-content:space-between;color:#c5c5c5;margin-bottom:7px}
.lab span:first-child{cursor:default}
.val{color:#e8e8e8;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;background:transparent;margin:0;cursor:pointer;outline:none;--p:50%;display:block}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;
  background:linear-gradient(var(--accent),var(--accent)) 0/var(--p) 100% no-repeat,var(--track)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:#e0e0e0;
  margin-top:-4px;border:0;transform:scale(0);transition:transform .14s}
.row:hover input[type=range]::-webkit-slider-thumb,input[type=range]:active::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb{transform:scale(1)}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:var(--track)}
input[type=range]::-moz-range-progress{height:3px;border-radius:2px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#e0e0e0;border:0}
.trow{display:flex;justify-content:space-between;align-items:center;height:29px;color:#c5c5c5}
.tg{border:0;background:none;color:var(--accent2);cursor:pointer;padding:2px 0 2px 12px;outline:none}
.tg.off{color:var(--dim)}
.tg:hover{text-decoration:underline;text-underline-offset:3px}
.btn{margin:10px 0 2px;width:100%;height:28px;border-radius:6px;border:1px solid #3c3c3c;background:#2d2d30;color:var(--fg);cursor:pointer;outline:none}
.btn:hover{background:#37373d;border-color:#4a4a4a}
.btn:active{background:#3f3f46}
</style>
</head>
<body>
<div id="app">
  <nav id="activity">
    <button class="act on" id="actExplorer" title="Explorer (⌘B)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M9 3.5h6l4 4v11.5H9z"/><path d="M15 3.5v4h4"/><path d="M6 7v14h10"/></svg>
    </button>
    <button class="act on" id="actParams" title="Parameters (⌥⌘B)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
    </button>
    <div class="spacer"></div>
    <button class="act" id="actReset" title="Reset view">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/><circle cx="12" cy="12" r="2.5"/></svg>
    </button>
  </nav>

  <aside id="explorer" class="panel"><div class="panel-inner">
    <div class="ph"><span>Explorer</span>
      <button class="x" data-close="explorer" title="Close (⌘B)"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </div>
    <div class="scroll" id="tree"></div>
  </div></aside>

  <main id="view">
    <div id="title"></div>
    <div id="toolbar"></div>
    <div id="hint">Click to place a charge · drag a charge to give it velocity in the plane · right-click removes it</div>
    <div id="offs"></div>
    <div id="hud" hidden>
      <div class="hud-h"><span id="hudq"></span><span class="hud-sub">drag to look around · scroll to zoom · double-click resets</span><button class="ib" title="Exit (Esc)" onclick="this.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}))">✕</button></div>
      <div class="hud-row"><svg id="hudx" viewBox="0 0 176 176" width="176" height="176"></svg><div class="hud-num" id="hudnum"></div></div>
      <div class="hud-leg"><i class="kb"></i>B across the path<i class="kf"></i>force (magnetic)<i class="ke"></i>force (electric)<span>⊗ = direction of travel</span></div>
      <canvas id="hudc" width="680" height="150"></canvas>
      <div class="hud-leg" id="hudlab"></div>
    </div>
    <div id="spin"></div>
  </main>

  <aside id="params" class="panel"><div class="panel-inner">
    <div class="ph"><div class="tabs"><button data-tab="field" class="on">Field</button><button data-tab="charges">Charges<span class="badge" hidden></span></button></div>
      <button class="x" data-close="params" title="Close (⌥⌘B)"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </div>
    <div class="scroll" id="tabField">
      <div class="plist" id="plist"></div>
      <div class="sec">Display</div>
      <div class="plist" id="dlist"></div>
    </div>
    <div class="scroll" id="tabCharges" hidden><div id="ppanel"></div></div>
  </div></aside>
</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* =====================================================================
   PHYSICS CORE (runs in a Web Worker)
   Every conductor is a chain of straight segments. The Biot–Savart law
       dB = (μ0/4π) I dl × r̂ / r²
   is integrated exactly over each straight segment and summed:
       B = (μ0 I/4π) (r1 × r2)(|r1|+|r2|) / (|r1||r2|(|r1||r2| + r1·r2))
   with r1, r2 the vectors from the segment ends to the field point.
   Inside the wire (radius RW) the field is smoothly regularised.
   Field lines: RK4 integration along B̂. Seeds: placed at equal-flux
   intervals along straight "rakes" on symmetry planes, so line spacing
   is inversely proportional to |B|.
   ===================================================================== */
function workerCore(){
  let S=null, NS=0, RW=0.03;
  const o=new Float64Array(4);

  function field(px,py,pz){
    let bx=0,by=0,bz=0,dmin=1e30;
    const s=S, a2=RW*RW, e=NS*7;
    for(let j=0;j<e;j+=7){
      const dx=s[j+3],dy=s[j+4],dz=s[j+5];
      const r1x=px-s[j],r1y=py-s[j+1],r1z=pz-s[j+2];
      const r2x=r1x-dx,r2y=r1y-dy,r2z=r1z-dz;
      const L2=dx*dx+dy*dy+dz*dz;
      let t=(r1x*dx+r1y*dy+r1z*dz)/L2; t=t<0?0:(t>1?1:t);
      const qx=r1x-t*dx,qy=r1y-t*dy,qz=r1z-t*dz,q2=qx*qx+qy*qy+qz*qz;
      if(q2<dmin)dmin=q2;
      const m1=Math.sqrt(r1x*r1x+r1y*r1y+r1z*r1z), m2=Math.sqrt(r2x*r2x+r2y*r2y+r2z*r2z);
      const cx=r1y*r2z-r1z*r2y, cy=r1z*r2x-r1x*r2z, cz=r1x*r2y-r1y*r2x;
      const den=m1*m2*(m1*m2+r1x*r2x+r1y*r2y+r1z*r2z);
      if(den<1e-24)continue;
      const p2=(cx*cx+cy*cy+cz*cz)/L2;            // squared distance to the segment's line
      const f=s[j+6]*(m1+m2)/den*(p2/(p2+a2));     // finite wire radius regularisation

  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

  function run(seed,dir,d,closeCheck){
    const bx0=d.box.min, bx1=d.box.max, H=d.H;
    const hMin=H*0.0015, hMax=H*0.02, maxLen=d.maxLen, tol0=0.015*H;
    const P=[],M=[];

    for(let n=0;n<4000;n++){
      field(x,y,z);

        const dd=Math.hypot(x-seed[0],y-seed[1],z-seed[2]),loose=Math.max(3*ah,2.5*tol0);
        if(dd<Math.max(1.5*ah,tol0)||(dd<loose&&dd>prevD)){P.push(seed[0],seed[1],seed[2]);M.push(M[0]);closed=true;why='closed';break}

  function traceLine(seed,d){

  function compute(d,post){

    // flux intervals along them, so spacing between neighbouring lines ∝ 1/|B|.
    const K=600, smp=[];

    const sgn=d.rakes.map((_,r)=>{let pos=0,neg=0;for(const q of smp)if(q.r===r){if(q.v>0)pos+=q.v;else neg-=q.v}return pos>=0.2*neg?1:-1});

    // 'even' mode: weight = length, so lines are evenly spaced along each rake

    const even=d.mode==='even', vmax=d.rakes.map(()=>0);

    const seeds=[]; let k=0;
    for(let s=0;s<d.nSeeds;s++){

      while(k<smp.length-1&&C[k]<target)k++;

        batch=[];bufs=[];

    post({type:'done',job:d.job});
  }

  if(typeof WorkerGlobalScope!=='undefined'&&self instanceof WorkerGlobalScope){
    self.onmessage=e=>compute(e.data,(m,tr)=>self.postMessage(m,tr||[]));
  }
  // Vector potential of the same segments: A = (μ0 I/4π) d̂ ln((|r1|+|r2|+L)/(|r1|+|r2|−L)).
  // Its time derivative gives the electric field induced by changing currents, E = −∂A/∂t.
  const oa=new Float64Array(3);

    let ax=0,ay=0,az=0;const s=S,e=NS*7;

      const g=s[j+6]/L*Math.log((m+L)/Math.max(m-L,RW*RW/L));
      ax+=g*dx;ay+=g*dy;az+=g*dz;
    }

  compute.A=(x,y,z)=>{vpot(x,y,z);return oa};
  compute.load=(segs,rw)=>{S=segs;NS=segs.length/7;RW=rw};
  compute.at=(x,y,z)=>{field(x,y,z);return o};
  compute.o=o;
  return compute;
}

/* ===================================================================== */
const RW=0.03;
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const scl=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const crs=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const nrm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return scl(a,1/l)};
function subdiv(pts,closed,maxL){
  const out=[],n=pts.length,m=closed?n:n-1;
  for(let i=0;i<m;i++){
    const a=pts[i],b=pts[(i+1)%n],k=Math.max(1,Math.ceil(Math.hypot(...sub(b,a))/maxL));
    for(let j=0;j<k;j++)out.push(add(a,scl(sub(b,a),j/k)));
  }
  if(!closed)out.push(pts[n-1]);
  return out;
}
const boxOf=(hx,hy,hz)=>({min:[-hx,-hy,-hz],max:[hx,hy,hz]});
const circlePts=(R,y,M)=>{const a=[];for(let i=0;i<M;i++){const f=2*Math.PI*i/M;a.push([R*Math.cos(f),y,-R*Math.sin(f)])}return a};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- circular accelerator (FODO ring, LHC-style cos-θ magnets) ----------
   Each magnet is built from conductors running along the beam at radius a around the pipe.
   Currents follow cos(nφ) around the aperture (n=1 dipole, n=2 quadrupole), the classic
   cos-θ / cos-2θ windings of superconducting accelerator magnets. Opposite-current
   conductors are joined into closed loops by arcs over the magnet ends. Everything is
   ordinary Biot–Savart; there is no iron. */
const ACC_R=5,ACC_A=.22;
function accelGeometry(N){
  const Lc=2*Math.PI*ACC_R/N,mags=[];
  for(let c=0;c<N;c++)for(const [f,type] of [[0,'QF'],[.25,'D'],[.5,'QD'],[.75,'D']])
    mags.push({type,th:2*Math.PI*(c+f)/N,L:type==='D'?.3*Lc:.1*Lc});
  return {mags,Lc};
}
function magnetFrame(m){
  const R=ACC_R;
  return {c:[R*Math.cos(m.th),0,R*Math.sin(m.th)],t:[-Math.sin(m.th),0,Math.cos(m.th)],r:[Math.cos(m.th),0,Math.sin(m.th)],y:[0,1,0]};
}
function magnetLoops(m,I){
  const {c,t,r,y}=magnetFrame(m),a=ACC_A,n=m.type==='D'?1:2;
  const phis=Array.from({length:8},(_,k)=>(k+.5)*Math.PI/4);
  const pairs=n===1?[[0,4],[1,5],[2,6],[3,7]]:[[0,2],[1,3],[4,6],[5,7]];
  const at=(phi,s)=>add(add(c,scl(t,s)),add(scl(r,a*Math.cos(phi)),scl(y,a*Math.sin(phi))));
  return pairs.map(([k1,k2])=>{
    const p1=phis[k1],p2=phis[k2],w=Math.cos(n*p1),L2=m.L/2,K=Math.max(3,Math.round((p2-p1)/(Math.PI/12)));
    const pts=[at(p1,-L2),at(p1,L2)];
    for(let j=1;j<K;j++)pts.push(at(p1+(p2-p1)*j/K,L2));
    pts.push(at(p2,L2),at(p2,-L2));
    for(let j=K-1;j>0;j--)pts.push(at(p1+(p2-p1)*j/K,-L2));
    return {pts,closed:true,I:I*w};
  });
}
// Design: pick q/m so that ∮(q/m)B_y ds / v = 2π (one full turn of bending from the dipoles),
// and the quadrupole current for thin-lens FODO with 90° phase advance per cell.
const ACC_DESIGN={};
function accelDesign(N){
  if(ACC_DESIGN[N])return ACC_DESIGN[N];
  const {mags,Lc}=accelGeometry(N),core=workerCore(),R=ACC_R,v0=2,Id=5;
  core.load(buildSegs(mags.filter(m=>m.type==='D').flatMap(m=>magnetLoops(m,1))),RW);
  let S=0;const M=1440;
  for(let i=0;i<M;i++){const th=2*Math.PI*(i+.5)/M,o=core.at(R*Math.cos(th),0,R*Math.sin(th));S+=o[1]*R*2*Math.PI/M}
  const sD=Math.sign(S)||1,qm=2*Math.PI*v0/(Math.abs(S)*Id);
  core.load(buildSegs(magnetLoops(mags[0],1)),RW);       // QF centred at θ = 0, beam along +z
  const d=.02,K=600,span=Lc/2;let FB=0;
  for(let i=0;i<K;i++){const s=-span/2+span*(i+.5)/K,o=core.at(R+d,0,s);FB+=o[1]*span/K}
  const invf=qm/v0*FB/d,sQ=Math.sign(invf)||1;            // 1/f per amp (> 0: focusing for + charges)
  const target=4*Math.sin(Math.PI/8)/Lc;                   // f = Lc / (4 sin(μ/2)), μ = 90°
  core.load(buildSegs(magnetLoops(mags[1],1)),RW);
  const Bd=Math.abs(core.at(...magnetFrame(mags[1]).c)[1])*Id;
  return ACC_DESIGN[N]={sD,Id,qm,v0,sQ,Iq:target/Math.abs(invf),Lc,mags,Bd};
}

/* ---------- parameters ---------- */
const m1=v=>v.toFixed(1)+' m', m2=v=>v.toFixed(2)+' m', int=v=>String(Math.round(v));
const prm=(key,label,min,max,step,value,fmt,extra)=>({key,label,min,max,step,value,fmt,...extra});
const pI=()=>prm('I','Current',0.5,20,0.5,5,v=>v.toFixed(1)+' A');

const VIS=[
{id:'infwire',item:'Infinite',title:'Infinite wire',params:[pI(),pN()],

{id:'random',item:'Random circuit',title:'Random circuit',random:true,

function cumOf(P){const n=P.length/3,c=new Float32Array(n);for(let i=1;i<n;i++){const j=3*i;c[i]=c[i-1]+Math.hypot(P[j]-P[j-3],P[j+1]-P[j-2],P[j+2]-P[j-1])}return c}

  getPoint(t,target=new THREE.Vector3()){
    const s=t*this.L,i=segAt(this.c,s),P=this.P,j=3*i,d=this.c[i+1]-this.c[i],f=d>0?(s-this.c[i])/d:0;
    return target.set(P[j]+(P[j+3]-P[j])*f,P[j+1]+(P[j+4]-P[j+1])*f,P[j+2]+(P[j+5]-P[j+2])*f);
  }
  getTangent(t,target=new THREE.Vector3()){
    const i=segAt(this.c,t*this.L),P=this.P,j=3*i;

const STOPS_EVEN=[[0,[.17,.33,.62]],[.3,[.31,.62,.95]],[.5,[.31,.79,.69]],[.75,[.86,.86,.67]],[1,[.95,.55,.40]]];
function ramp(t){
  const S=state.display.spacing==='even'?STOPS_EVEN:STOPS;
  for(let i=1;i<S.length;i++)if(t<=S[i][0]){
    const [t0,a]=S[i-1],[t1,b]=S[i],f=(t-t0)/(t1-t0);
    return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f];
  }

}

const B_LOG_TOP=6e-5,B_LOG_DEC=3,B_LIN_TOP=4e-5;

  if(state.display.scale==='log'){const v=(Math.log10(b+1e-30)-Math.log10(B_LOG_TOP)+B_LOG_DEC)/B_LOG_DEC;return v<0?0:v>1?1:v}
  const v=b/B_LIN_TOP;return v>1?1:v;
}

  clear:'<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.7 8.5h5.6l.7-8.5"/></svg>',
  eye:'<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8 12.1 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg>',
  eyeOff:'<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8 12.1 12.5 8 12.5 1.5 8 1.5 8z"/><path d="M2.5 13.5l11-11"/></svg>',
  x:'<svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>',
  inspect:'<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle cx="7" cy="7" r="4.3"/><path d="M10.2 10.2L14 14"/><circle cx="7" cy="7" r="1.3" fill="currentColor"/></svg>',
  look:'<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M2 5.5l6-3 6 3-6 3z"/><path d="M8 8.5v5"/><path d="M6.3 12l1.7 1.6L9.7 12"/></svg>'};
const tb=$('#toolbar');
function buildToolbar(){
  const v=VIS_BY[state.vis];let h='';
  if(v.circuit)h+=`<div class="seg"><button data-act="circuit" title="Include leads and battery (C)"><span>Circuit</span><span class="sw"><i></i></span></button></div>`;
  if(chargeUI()){
    const planes=[['xy','XY'],['yz','YZ'],['zx','ZX'],...(v.uniform?[['perpB','⊥B']]:[]),['view','View']];
    h+=`<div class="seg">
        <button data-tool="orbit" title="Select / orbit (Esc)">${ICON.orbit}</button>
        <button data-tool="pos" title="Place positive charges"><span class="dot pos">+</span></button>
        <button data-tool="neg" title="Place negative charges"><span class="dot neg">−</span></button></div>
      <div class="seg">${planes.map(([k,l])=>
        `<button data-plane="${k}" title="${k==='view'?'Use the current view as the working plane':'Look at the '+l+' plane; new charges go here'}">${l}</button>`).join('')}</div>
      <div class="seg"><button data-act="play" title="Run / pause (Space)"></button><button data-act="reset" title="Reset to initial conditions (R)">${ICON.reset}</button>
        <button data-act="follow" title="Camera follows the selected charge (F)">${ICON.follow}</button>
        <button data-act="inspect" title="Ride along with the selected charge (I)">${ICON.inspect}<span>Inspect</span></button>
        <button data-act="clear" title="Remove all charges">${ICON.clear}</button></div>`;
  }
  tb.innerHTML=h;
  tb.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
  tb.querySelectorAll('[data-plane]').forEach(b=>b.onclick=()=>setPlane(b.dataset.plane,true));
  tb.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>({circuit:toggleCircuit,play:togglePlay,reset:resetRun,
    follow:()=>{PART.follow=!PART.follow;syncToolbar()},inspect:()=>INS.on?exitInspect():enterInspect(),clear:clearParticles})[b.dataset.act]());
  syncToolbar();fitToolbar();
}
function syncToolbar(){
  const setup=PART.mode==='setup';
  tb.querySelectorAll('[data-tool]').forEach(b=>{b.classList.toggle('on',b.dataset.tool===PART.tool);b.classList.toggle('dis',!setup&&b.dataset.tool!=='orbit')});
  tb.querySelectorAll('[data-plane]').forEach(b=>b.classList.toggle('on',b.dataset.plane===PART.plane));
  const pb=tb.querySelector('[data-act=play]');
  if(pb){pb.innerHTML=PART.mode==='run'?ICON.pause:ICON.play;pb.classList.toggle('dis',!PART.list.length);pb.classList.toggle('accent',PART.mode!=='run'&&PART.list.length>0)}
  tb.querySelector('[data-act=reset]')?.classList.toggle('dis',setup);
  tb.querySelector('[data-act=follow]')?.classList.toggle('on',PART.follow);
  const ib=tb.querySelector('[data-act=inspect]');if(ib){ib.classList.toggle('on',INS.on);ib.classList.toggle('dis',!PART.sel&&!INS.on)}
  const cb=tb.querySelector('[data-act=circuit]');if(cb)cb.classList.toggle('on',state.display.circuit);
}
// drop the toolbar below the title when the viewport is too narrow for both on one line
function fitToolbar(){
  tb.classList.remove('low');
  const t=$('#title').getBoundingClientRect(),r=tb.getBoundingClientRect();
  tb.classList.toggle('low',r.width>0&&r.left<t.right+16);
}
function toggleCircuit(){state.display.circuit=!state.display.circuit;syncToolbar();buildParams();applyVis(false)}
new ResizeObserver(fitToolbar).observe(view);


/* ---------- UI ---------- */
const chev='<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6.5l3 3 3-3"/></svg>';
function buildTree(){
  const tree=$('#tree');tree.innerHTML='';
  for(const [g,ids] of GROUPS){
    const h=document.createElement('div');h.className='grp';h.innerHTML=chev+'<span>'+g+'</span>';
    h.onclick=()=>h.classList.toggle('collapsed');
    const box=document.createElement('div');box.className='items';
    for(const id of ids){
      const it=document.createElement('div');it.className='item';it.dataset.id=id;it.textContent=VIS_BY[id].item;
      it.onclick=()=>select(id);box.appendChild(it);
    }
    tree.append(h,box);
  }
}
function markTree(){for(const el of document.querySelectorAll('.item'))el.classList.toggle('sel',el.dataset.id===state.vis)}
function setFill(inp){inp.style.setProperty('--p',((inp.value-inp.min)/(inp.max-inp.min)*100)+'%')}
function buildParams(){
  const v=VIS_BY[state.vis],p=P(),pl=$('#plist');pl.innerHTML='';
  for(const d of v.params){
    if(d.circuitOnly&&!state.display.circuit)continue;
    const row=document.createElement('div');row.className='row';
    row.innerHTML=`<div class="lab"><span title="Double-click to reset">${d.label}</span><span class="val"></span></div>`;
    const inp=document.createElement('input');Object.assign(inp,{type:'range',min:d.min,max:d.max,step:d.step,value:p[d.key]});
    const val=row.querySelector('.val');
    const sync=()=>{val.textContent=d.fmt(p[d.key]);setFill(inp)};
    const set=x=>{p[d.key]=x;inp.value=x;sync();if(d.live)return;if(d.key==='I')recolorAll();else scheduleRebuild()};
    inp.oninput=()=>set(+inp.value);
    row.querySelector('.lab span').ondblclick=()=>set(d.value);
    row.appendChild(inp);sync();pl.appendChild(row);
  }
  if(v.random){
    const b=document.createElement('button');b.className='btn';b.textContent='Randomize';b.title='Randomize (R)';
    b.onclick=randomize;pl.appendChild(b);
  }
  const dlist=$('#dlist');dlist.innerHTML='';
  const tg=(label,get,flip,on='On',off='Off')=>{
    const r=document.createElement('div');r.className='trow';
    const b=document.createElement('button');b.className='tg';
    const s=()=>{const x=get();b.textContent=x?on:off;b.classList.toggle('off',!x&&off==='Off')};
    b.onclick=()=>{flip();s()};s();
    r.innerHTML=`<span>${label}</span>`;r.appendChild(b);dlist.appendChild(r);
  };
  const D=state.display;
  tg('Arrows',()=>D.arrows,()=>{D.arrows=!D.arrows});
  if(!v.uniform){
    tg('Current flow',()=>D.flow,()=>{D.flow=!D.flow});
    tg('Line spacing',()=>D.spacing==='flux',toggleSpacing,'By flux','Even');
  }else{
    tg('Working plane',()=>planeGroup.userData.show!==false,()=>{planeGroup.userData.show=planeGroup.userData.show===false;planeGroup.visible=planeGroup.userData.show});
    tg('Axes',()=>axesGroup.userData.show!==false,()=>{axesGroup.userData.show=axesGroup.userData.show===false;axesGroup.visible=axesGroup.userData.show});
  }
  tg('Intensity scale',()=>D.scale==='log',()=>{D.scale=D.scale==='log'?'linear':'log';recolorAll()},'Log','Linear');
  tg('Auto-rotate',()=>D.rotate,()=>{D.rotate=!D.rotate});
}
function toggleSpacing(){state.display.spacing=state.display.spacing==='flux'?'even':'flux';applyVis(false)}
function randomize(){state.seed=(Math.random()*1e9)|0;applyVis(false)}
function select(id){
  if(typeof INS!=='undefined'&&INS.on)exitInspect();
  state.vis=id;markTree();
  $('#title').textContent=VIS_BY[id].title;
  switchScene(id);
  if(VIS_BY[id].uniform)setTab('charges',true);
  buildParams();applyVis(true);
  if(PART.plane==='view'){PART.n.copy(PART.viewN);updateGizmo()}else setPlane(PART.plane,false);
  applyChargeUI();
}
function togglePanel(id,force){
  const el=$('#'+id),open=force??el.classList.contains('closed');
  el.classList.toggle('closed',!open);
  $(id==='explorer'?'#actExplorer':'#actParams').classList.toggle('on',open);
  if(typeof INS!=='undefined'&&INS.on)placeHud();
}
$('#actExplorer').onclick=()=>togglePanel('explorer');
$('#actParams').onclick=()=>togglePanel('params');
$('#actReset').onclick=()=>setView();
for(const b of document.querySelectorAll('[data-close]'))b.onclick=()=>togglePanel(b.dataset.close,false);
addEventListener('keydown',e=>{
  const mod=e.metaKey||e.ctrlKey;
  if(mod&&e.code==='KeyB'){e.preventDefault();togglePanel(e.altKey?'params':'explorer');return}
  if(e.target.tagName==='INPUT'||mod)return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();const i=ORDER.indexOf(state.vis),n=ORDER.length;
    select(ORDER[(i+(e.key==='ArrowDown'?1:n-1))%n]);
  }
  if(e.key==='r'||e.key==='R'){if(chargeUI())resetRun();else if(VIS_BY[state.vis].random)randomize()}
  const v=VIS_BY[state.vis];
  if((e.key==='s'||e.key==='S')&&!v.uniform){toggleSpacing();buildParams()}
  if((e.key==='c'||e.key==='C')&&v.circuit)toggleCircuit();
  if(chargeUI()||PART.list.length){
    if(e.target.tagName==='BUTTON')e.target.blur();
    if(e.key===' '){e.preventDefault();togglePlay()}
    if(e.key==='Escape'){if(INS.on){exitInspect();return}setTool('orbit');selectP(null)}
    if(e.key==='i'||e.key==='I'){INS.on?exitInspect():enterInspect()}
    if(e.key==='f'||e.key==='F'){PART.follow=!PART.follow;syncToolbar()}
    if((e.key==='Backspace'||e.key==='Delete')&&PART.sel){e.preventDefault();removeParticle(PART.sel);refreshUI()}
  }
});
if(innerWidth<820){togglePanel('explorer',false);togglePanel('params',false)}

buildTree();
requestAnimationFrame(()=>{select(state.vis);frame()});
</script>
</body>
</html>
